services:
  postgres:
    image: postgres:16-alpine
    container_name: idp-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-idp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-idp_password}
      POSTGRES_DB: ${POSTGRES_DB:-idp_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-idp_user} -d ${POSTGRES_DB:-idp_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: idp-platform-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-idp_user}:${POSTGRES_PASSWORD:-idp_password}@postgres:5432/${POSTGRES_DB:-idp_platform}?schema=public
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run start:dev

volumes:
  postgres_data: